services:
  redagent-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: redagent-api:latest
    container_name: redagent-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SAFEGUARD_API_HOST: "0.0.0.0"
      SAFEGUARD_API_PORT: "8000"
    env_file:
      - .env
    volumes:
      # Persist scan output and let config be edited without a rebuild.
      - ./runs-api:/app/runs-api
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
